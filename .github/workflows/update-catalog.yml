name: Update Plugin Repository
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jellysin/release-helper/actions/catalog@fdc3bacd4a87749466c1af6d25a08fdefb4c500f # v1.7.2
        with:
          token: ${{ github.token }}
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: repository-pr
        with:
          token: ${{ github.token }}
          # The main ruleset requires signed commits; an unsigned commit on this branch blocks the merge.
          sign-commits: true
          branch: automation/repository
          base: main
          delete-branch: true
          add-paths: manifest.json
          commit-message: 'chore: add verified plugin releases to plugin repository'
          title: 'chore: add verified plugin releases to plugin repository'
          # Keep the template headings and one line per paragraph: the forge renders every newline.
          body: |
            ## Description

            Adds published plugin versions after checking the allowlist, immutable release state, signed provenance, exact source tag and commit, archive contents and checksums. Existing plugin repository versions are preserved.

            ## Pre-Merge Verification Checklist

            - [ ] The CI and CodeQL runs of this pull request pass: the CI job (workflow lint, interpreter pin, repository tests, manifest and allowlist checks), server-check, scanners, governance (praetor), and the CodeQL jobs analyze (python) and analyze (actions). GitHub may hold these runs until a maintainer approves them. The CI run this workflow dispatches on the branch is an early signal and does not count toward the required checks. It does not run `make verify-all`, which stays a local check.
            - [x] Only `manifest.json` changes; no function, public interface or agent context changes, so the HISS, 3D test and context items do not apply.
            - [x] The commit message follows Conventional Commits.
      # Dispatched CI is an early signal only and never counts toward the required checks; dispatch once per head commit because a second run cancels the first; a cancelled run is dispatched again.
      - name: Explicitly dispatch CI for the bot pull request
        if: steps.repository-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.repository-pr.outputs.pull-request-number }}
        run: |
          head=$(gh pr view "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          test -n "$head"
          ci_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=workflow_dispatch&head_sha=$head&per_page=100" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length')
          failed=0
          if [ "$ci_runs" = 0 ]; then gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/repository || failed=1; fi
          exit "$failed"
