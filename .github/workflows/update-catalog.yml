name: Update Plugin Repository
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jellysin/release-helper/actions/catalog@8e75bfdf6eb89283afb68c5bc50d5645c984752c # v1.7.0
        with:
          token: ${{ github.token }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: repository-pr
        with:
          token: ${{ github.token }}
          # The main ruleset requires signed commits; an unsigned commit on this branch blocks the merge.
          sign-commits: true
          branch: automation/repository
          base: main
          delete-branch: true
          add-paths: manifest.json
          commit-message: 'chore: add verified plugin releases to plugin repository'
          title: 'chore: add verified plugin releases to plugin repository'
          # Keep the template headings and one line per paragraph: the forge renders every newline.
          body: |
            ## Description

            Adds published plugin versions after checking the allowlist, immutable release state, signed provenance, exact source tag and commit, archive contents and checksums. Existing plugin repository versions are preserved.

            ## Pre-Merge Verification Checklist

            - [ ] The CI and CodeQL runs this workflow dispatches on this branch pass: the CI job (workflow lint, interpreter pin, repository tests, manifest and allowlist checks), server-check, scanners, governance (praetor), and the CodeQL jobs analyze (python) and analyze (actions); the required checks block the merge until they do. It does not run `make verify-all`, which stays a local check.
            - [x] Only `manifest.json` changes; no function, public interface or agent context changes, so the HISS, 3D test and context items do not apply.
            - [x] The commit message follows Conventional Commits.
      - name: Explicitly dispatch the required checks for the bot pull request
        if: steps.repository-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/repository
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref automation/repository
