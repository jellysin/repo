name: Release automation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-automation
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: jellysin/release-helper/.github/workflows/release-please.yml@b08aab97ba0ffbe4d9808461677ccdcb588bd0ca # v1.1.0
