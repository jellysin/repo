name: Release automation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-automation
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: jellysin/release-helper/.github/workflows/release-please.yml@0c04f543518359a7fc56dfca10ed918ac9919d08 # v1.6.2
    with:
      prepare-release: true
