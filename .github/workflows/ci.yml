name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jellysin/release-helper/actions/check@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
        with:
          catalog: 'true'
      - uses: jellysin/release-helper/actions/milestone@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
      - name: Validate workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Negative control: the step above is green only if actionlint can fail. It must refuse a
      # planted workflow whose job lacks runs-on, with exit status 1 and that finding.
      - name: actionlint refuses a planted workflow defect
        run: |
          printf '%s\n' 'on: push' 'jobs:' '  planted:' '    steps:' '      - run: echo planted' > "$RUNNER_TEMP/planted.yml"
          status=0
          output="$("$RUNNER_TEMP/actionlint" -no-color "$RUNNER_TEMP/planted.yml" 2>&1)" || status=$?
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          grep --fixed-strings --quiet '"runs-on" section is missing in job "planted"' <<<"$output"
      - name: Check the interpreter against .python-version
        run: python -B scripts/python_pin.py
      - name: Run the repository tests
        run: python -B -m unittest discover -s tests
      # Every version main publishes stays as it was, and every listed version's download answers
      # (scripts/manifest_checks.py). A dispatched run of the updater's branch compares with main too.
      - name: Published manifest versions stay as they were
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python -B scripts/manifest_checks.py history origin/main
      - name: Every manifest version can be downloaded
        run: python -B scripts/manifest_checks.py releases
      # The allowlist check above runs on plugins.json only. Each planted allowlist in
      # tests/fixtures/allowlist/refused.txt must be refused with exit status 1 and its reason,
      # and an allowlist of 32 plugins, the most the helper takes, must pass. The check also reads
      # manifest.json, so that allowlist holds every plugin of plugins.json.
      - name: The allowlist check refuses planted allowlists
        run: |
          while IFS='|' read -r file reason; do
            status=0
            output="$(python -B scripts/release_helper.py validate-catalog --allowlist "tests/fixtures/allowlist/$file" 2>&1)" || status=$?
            printf '%s: %s\n' "$file" "$output"
            [[ "$status" -eq 1 ]]
            grep --fixed-strings --quiet "jellysin-release-helper: $reason" <<<"$output"
          done < tests/fixtures/allowlist/refused.txt
          python -B scripts/release_helper.py validate-catalog --allowlist tests/fixtures/allowlist/thirty-two.json
  server-check:
    name: server-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A real Jellyfin server offers every entry of manifest.json
        uses: jellysin/release-helper/actions/server-check@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
        with:
          manifest: manifest.json
      - name: Write the server check fixtures
        run: |
          python -B scripts/release_helper.py server-check --emit-fixture floor "$RUNNER_TEMP/floor.json"
          python -B scripts/release_helper.py server-check --emit-fixture wrong-abi "$RUNNER_TEMP/wrong-abi.json"
      - name: The same server offers the floor fixture
        uses: jellysin/release-helper/actions/server-check@c0f6e472f9ac4da2ccdd10afd0a7a167d938b566 # v1.6.0
        with:
          manifest: ${{ runner.temp }}/floor.json
      # The step passes only on the refusal it expects; any other failure fails it.
      - name: The same server refuses the wrong-abi fixture
        run: |
          status=0
          output="$(python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/wrong-abi.json" 2>&1)" || status=$?
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          grep --fixed-strings --quiet 'does not offer d0973630-1561-4f3a-b26e-664229e6043e 1.0.0.0 (targetAbi 12.65534.0.0)' <<<"$output"
      # The boundary where a server silently drops an entry: at the server's own version the
      # floor fixture must be offered, one patch above it refused. The version is read from the
      # server, so the step follows the image release-helper pins.
      - name: The same server offers an entry at its own version and refuses one a patch above
        run: |
          output="$(python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/floor.json" 2>&1)"
          printf '%s\n' "$output"
          version="$(sed -n 's/^server-check: server version \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' <<<"$output")"
          [[ -n "$version" ]]
          IFS=. read -r major minor patch <<<"$version"
          above="$major.$minor.$((patch + 1)).0"
          jq --arg abi "$version.0" '.[0].versions[0].targetAbi = $abi' "$RUNNER_TEMP/floor.json" > "$RUNNER_TEMP/at-server.json"
          jq --arg abi "$above" '.[0].versions[0].targetAbi = $abi' "$RUNNER_TEMP/floor.json" > "$RUNNER_TEMP/above-server.json"
          python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/at-server.json"
          status=0
          output="$(python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/above-server.json" 2>&1)" || status=$?
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          grep --fixed-strings --quiet "does not offer d0973630-1561-4f3a-b26e-664229e6043e 1.0.0.0 (targetAbi $above)" <<<"$output"
      # The repository serves Jellyfin 12 plugins and the floor fixture targets ABI 12.0, but the
      # steps above run release-helper's pinned 12.2 server only. The older 12 releases, pinned
      # by digest (Docker Hub, read 2026-10-13), must offer manifest.json and the floor fixture
      # and refuse the wrong-abi fixture too.
      - name: Jellyfin 12.0 and 12.1 offer every entry and the floor fixture and refuse the wrong-abi one
        env:
          IMAGES: >-
            jellyfin/jellyfin:12.0@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
            jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
        run: |
          for image in $IMAGES; do
            python -B scripts/release_helper.py server-check --manifest manifest.json --image "$image"
            python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/floor.json" --image "$image"
            status=0
            output="$(python -B scripts/release_helper.py server-check --manifest "$RUNNER_TEMP/wrong-abi.json" --image "$image" 2>&1)" || status=$?
            printf '%s\n' "$output"
            [[ "$status" -eq 1 ]]
            grep --fixed-strings --quiet 'does not offer d0973630-1561-4f3a-b26e-664229e6043e 1.0.0.0 (targetAbi 12.65534.0.0)' <<<"$output"
          done
  # The scanners the standards declare (facets security:high and agent:sandboxed). Each one is a
  # pinned release whose archive checksum is checked before it runs, and any finding fails the job.
  scanners:
    name: scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The checkout fetches every branch; only the history of the commit under test is scanned.
      - name: No secret in the history (gitleaks)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose --exit-code 1 .
      - name: No high or critical vulnerability, secret or misconfiguration (trivy)
        env:
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - name: No blocking static analysis finding (semgrep)
        run: pipx run --spec semgrep==1.180.0 semgrep scan --config p/python --config p/github-actions --metrics=off --error --disable-version-check
  governance:
    name: governance (praetor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      # PRAETOR_REF is the repository's engine pin: the git hooks and make read it from here
      # (.config/lefthook/engine.sh) and run the same engine CI installs. One value only.
      - name: Install praetorctl
        env:
          PRAETOR_REF: 32a35c8fb947b449ff46ae0a3b32017b409dccad
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Context integrity
        run: praetorctl compile-context --verify
      # Negative control: the step above is green only if the check can fail. A copy of the
      # checkout whose CLAUDE.md drifted from AGENTS.md must be refused with exit status 1.
      - name: Context integrity refuses a planted stale context
        run: |
          cp -R . "$RUNNER_TEMP/stale-context"
          printf '\nplanted drift\n' >> "$RUNNER_TEMP/stale-context/CLAUDE.md"
          status=0
          output="$(cd "$RUNNER_TEMP/stale-context" && praetorctl compile-context --verify 2>&1)" || status=$?
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          grep --fixed-strings --quiet 'target CLAUDE.md is out of sync with AGENTS.md' <<<"$output"
      - name: HISS audit
        run: praetorctl audit
      - name: Flavor audit
        # .workingdir/ ledgers are gitignored; the flavor audit requires them.
        run: |
          praetorctl state init --if-absent .
          praetorctl flavor audit .
