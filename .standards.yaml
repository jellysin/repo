---
version: 1
repository:
  owner: jellysin
  name: repo
  visibility: public
  description: "JellySin Plugin Repository for Jellyfin 12"
  homepage: "https://raw.githubusercontent.com/jellysin/repo/main/manifest.json"
  topics:
    - jellyfin
    - jellyfin-plugin
    - plugin-repository
# Agent clients and editors in use. The engine generates and verifies the files of these only.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
profiles:
  - template-seed
facets:
  - security:high
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:ac76ac78e354aa8628cf74916271fef35ec9de2af6244ce254ee449ffabd121e
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
# One maintainer: no approving review is required and the admin role may bypass on pull
# requests only. The required count stays, so that restoring independent review keeps it.
overrides:
  branch_protection:
    required_approving_reviewers: 1
    review_mode: single_maintainer
exceptions:
  - rule: HISS-11
    path: .github/workflows/release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-09"
